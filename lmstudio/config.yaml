# Domios Router (plugin id lmstudio) configuration.
#
# Providers and presets are usually managed in the Router view or with agent
# verbs. Optional read-only providers can be declared here; keys never go in
# this file (each provider names a secret slot such as openrouter_api_key):
#
# providers:
#   - { id: openrouter, name: OpenRouter, kind: openai, baseUrl: https://openrouter.ai/api/v1 }
#
# defaultProvider: lmstudio
# showUsage: true
#
# Start LM Studio, load a model, and start the Developer server.
# Server address, e.g. http://localhost:1234 or
# http://<mac>.<tailnet>.ts.net:1234. This shared address is used by chat and
# decision requests; a remote host needs a grant in CodeTerm plugin settings.

baseUrl: http://localhost:1234

# OpenAI-compatible decision endpoint settings.
decision:
  # Blank inherits `model` when set, otherwise the first loaded model.
  model: ""
  # auto uses constrained JSON for model ids containing MLX (owner-probed null
  # logprobs); set to logprobs or constrained to override for a model.
  logprobsMode: auto
  maxTokens: 64
  timeoutMs: 30000

# Optional global model fallback. Leave blank to let LM Studio route to the
# loaded model, or set a model id returned by listModels.
model: ""

defaultPreset: codeterm

presets:
  - id: codeterm
    name: CodeTerm Assistant
    # Optional exact model id binding. When the chosen session model matches,
    # this preset's prompt and params are selected automatically.
    model: ""
    params:
      temperature: 0.7
    systemPrompt: |
      # CodeTerm Assistant

      Be concise, direct, and practical.

      Call tools natively when the API offers them. Otherwise emit exactly one fenced call:

      ```codeterm-tool
      {"tool":"codeterm","args":{"args":"tab list"}}
      ```

      Tools: `exec` (cmd, optional cwd), `codeterm` (args), `read_file` (path), `write_file` (path, content), `mem_search` (query), `spawn_agent` (provider, task, optional workspace).

      After a tool runs, read its `tool_result` and decide the next step. Stop when the result answers the question.


# Named watcher charters — use --charter charter:<id>. Bodies ship in prompts/*.md
# and are bundled into plugin.js at build time (not duplicated here).
charters:
  watcher-orchestration: prompts/watcher-orchestration.md
